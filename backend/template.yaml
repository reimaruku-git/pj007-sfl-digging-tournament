AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  pj007-digging-tournament
  SFL Digging Tournament — public leaderboard + master-admin API.
  GitHub OIDC deploys this stack only. Does not create the account OIDC provider.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        ALLOWED_ORIGINS: !If
          - IsDev
          - !Join
            - ","
            - - http://localhost:5173
              - !Ref AllowedOrigin
          - !If
            - HasWwwOrigin
            - !Join
              - ","
              - - !Ref AllowedOrigin
                - !Ref WwwOrigin
                - !Sub "https://${FrontendDistribution.DomainName}"
            - !Join
              - ","
              - - !Ref AllowedOrigin
                - !Sub "https://${FrontendDistribution.DomainName}"
        DATA_BUCKET: !Ref AppBucket
        CONFIG_TABLE: !Ref TournamentConfigTable
        SCORES_TABLE: !Ref DigScoresTable
        SUBMISSIONS_TABLE: !Ref PendingSubmissionsTable
        DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prd]
  ProjectNo:
    Type: String
    Default: "pj007"
  ProjectName:
    Type: String
    Default: "digging-tournament"
  BillingTag:
    Type: String
    Default: "pj007"
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin (site URL)
  WwwOrigin:
    Type: String
    Default: ""
    Description: Extra CORS origin for www (https://www.…). Empty skips it.
  SiteDomainName:
    Type: String
    Default: ""
    Description: Optional public site hostname (CloudFront alias). Empty keeps the default *.cloudfront.net URL.
  WwwDomainName:
    Type: String
    Default: ""
    Description: Optional www hostname on the same CloudFront distribution.
  CloudFrontCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering SiteDomainName and WwwDomainName.
  ApiDomainName:
    Type: String
    Default: ""
    Description: Optional API hostname (HTTP API custom domain). Empty keeps the execute-api URL.
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in this region covering ApiDomainName.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone for the site and API hostnames.
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Discord webhook for new 1st-place notifications
  GitHubRepo:
    Type: String
    Default: "reimaruku-git/pj007-sfl-digging-tournament"
    Description: GitHub repository in org/repo format (documentation / overrides)
  GitHubOidcClassicSubject:
    Type: String
    Default: "repo:reimaruku-git/pj007-sfl-digging-tournament:*"
    Description: >
      Classic GitHub Actions OIDC `sub` StringLike (`repo:org/repo:…`).
      Dev allows all refs (`:*`). Prd is `ref:refs/heads/main` only.
  GitHubOidcSubject:
    Type: String
    Default: "repo:reimaruku-git@248281558/pj007-sfl-digging-tournament@1334189130:*"
    Description: >
      Immutable GitHub Actions OIDC `sub` StringLike (`repo:owner@id/repo@id:…`).
      Dev allows all refs (`:*`). Prd is `ref:refs/heads/main` only.

Conditions:
  IsDev: !Equals [!Ref Environment, dev]
  HasWwwOrigin: !Not [!Equals [!Ref WwwOrigin, ""]]
  HasSiteDomain: !And
    - !Not [!Equals [!Ref SiteDomainName, ""]]
    - !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasWwwDomain: !And
    - !Condition HasSiteDomain
    - !Not [!Equals [!Ref WwwDomainName, ""]]
  HasApiDomain: !And
    - !Not [!Equals [!Ref ApiDomainName, ""]]
    - !Not [!Equals [!Ref ApiCertificateArn, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-common-layer
      Description: Shared tournament scoring, SFL client, and stores
      ContentUri: lib/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  # ----------------------------------------------------------------
  # S3 — frontend/ origin + config/tracked-farms.json
  # ----------------------------------------------------------------

  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectNo}-${Environment}-${ProjectName}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  # Private SFL Community API keys. Not the CloudFront origin.
  SecretsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-secrets
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  # ----------------------------------------------------------------
  # DynamoDB
  # ----------------------------------------------------------------

  TournamentConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-config
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  DigScoresTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-scores
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: farm_id
          AttributeType: S
      KeySchema:
        - AttributeName: farm_id
          KeyType: HASH
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  PendingSubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-submissions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: farm_id
          AttributeType: S
      KeySchema:
        - AttributeName: farm_id
          KeyType: HASH
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  # ----------------------------------------------------------------
  # Cognito — admin-created users only. No self-signup.
  # Public leaderboard stays open; JWT is required only on /admin/*.
  # ----------------------------------------------------------------

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        BillingTag: !Ref BillingTag
        ProjectNo: !Ref ProjectNo

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ----------------------------------------------------------------
  # HTTP API — public reads + Cognito JWT on /admin/*
  # ----------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizationScopes: []
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
      CorsConfiguration:
        AllowOrigins: !Split
          - ","
          - !If
            - IsDev
            - !Join
              - ","
              - - http://localhost:5173
                - !Ref AllowedOrigin
            - !If
              - HasWwwOrigin
              - !Join
                - ","
                - - !Ref AllowedOrigin
                  - !Ref WwwOrigin
                  - !Sub "https://${FrontendDistribution.DomainName}"
              - !Join
                - ","
                - - !Ref AllowedOrigin
                  - !Sub "https://${FrontendDistribution.DomainName}"
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
          - X-Amz-User-Agent
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600

  MainFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-main-function
      RetentionInDays: 14

  FarmSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-farm-sync
      RetentionInDays: 14

  MainFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-main-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MainLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-main-function
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-main-function:*
        - PolicyName: MainDynamoDB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt TournamentConfigTable.Arn
                  - !GetAtt DigScoresTable.Arn
                  - !GetAtt PendingSubmissionsTable.Arn
        - PolicyName: MainS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${AppBucket.Arn}/config/*
                  - !Sub ${AppBucket.Arn}/snapshots/*
                  - !Sub ${AppBucket.Arn}/archives/*
                  - !Sub ${AppBucket.Arn}/media/tournaments/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt AppBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - config/*
                      - snapshots/*
                      - archives/*
                      - media/tournaments/*
        - PolicyName: MainInvokeSync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt FarmSyncFunction.Arn
        - PolicyName: MainSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub ${SecretsBucket.Arn}/sfl-api-keys.json
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  FarmSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-farm-sync-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FarmSyncLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-farm-sync
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-farm-sync:*
        - PolicyName: FarmSyncDynamoDB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt TournamentConfigTable.Arn
                  - !GetAtt DigScoresTable.Arn
                  - !GetAtt PendingSubmissionsTable.Arn
        - PolicyName: FarmSyncS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub ${AppBucket.Arn}/config/*
                  - !Sub ${AppBucket.Arn}/snapshots/*
                  - !Sub ${AppBucket.Arn}/archives/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt AppBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - config/*
                      - snapshots/*
                      - archives/*
        - PolicyName: FarmSyncSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub ${SecretsBucket.Arn}/sfl-api-keys.json
        - PolicyName: FarmSyncSelfInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectNo}-${Environment}-${ProjectName}-farm-sync
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  MainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-main-function
      Description: HTTP API router — public leaderboard + master admin
      CodeUri: lambda_functions/main_function/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt MainFunctionRole.Arn
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          FARM_SYNC_FUNCTION: !Ref FarmSyncFunction
          SECRETS_BUCKET: !Ref SecretsBucket
          SFL_KEYS_OBJECT: sfl-api-keys.json
      Tags:
        BillingTag: !Ref BillingTag
        ProjectNo: !Ref ProjectNo
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        GetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /config
            Method: GET
        GetSlogans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /slogans
            Method: GET
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /leaderboard
            Method: GET
        ListTournaments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tournaments
            Method: GET
        GetTournament:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tournaments/{tournament_id}
            Method: GET
        GetTournamentMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /media/tournaments/{tournament_id}/{filename}
            Method: GET
        GetTournamentFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tournaments/{tournament_id}/farms/{farm_id}
            Method: GET
        GetFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /farms/{farm_id}
            Method: GET
        GetFarmMemberships:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /farms/{farm_id}/memberships
            Method: GET
        PostIdentify:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /identify
            Method: POST
        PostSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /submissions
            Method: POST
        AdminSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/session
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminGetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/config
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPutConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/config
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminGetSlogans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/slogans
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPostSlogans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/slogans
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPutSlogans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/slogans
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPutFeatured:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/featured
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminListTournaments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminCreateTournament:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminUpdateTournament:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminDeleteTournament:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPutTournamentImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}/images
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminListFarms:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminAddFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminGetFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms/{farm_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminUpdateFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms/{farm_id}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminDeleteFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms/{farm_id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        AdminTournamentRoster:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}/roster
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminAddTournamentFarms:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}/farms
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminRemoveTournamentFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/tournaments/{tournament_id}/farms/{farm_id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        AdminListIdentities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/identities
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminListSubmissions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/submissions
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        AdminApproveSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/submissions/{farm_id}/{tournament_id}/approve
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminRejectSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/submissions/{farm_id}/{tournament_id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        AdminRefreshFarm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/farms/{farm_id}/refresh
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminSync:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/sync
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        AdminPutScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/scores/{farm_id}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        AdminGetSnapshot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/scores/{farm_id}/snapshot
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  FarmSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-farm-sync
      Description: Walks tracked farms; SFL keys from the private secrets bucket; continues itself if the 15-minute window is almost up
      CodeUri: lambda_functions/farm_sync/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 900
      Role: !GetAtt FarmSyncRole.Arn
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          FARM_SYNC_FUNCTION: !Sub ${ProjectNo}-${Environment}-${ProjectName}-farm-sync
          SECRETS_BUCKET: !Ref SecretsBucket
          SFL_KEYS_OBJECT: sfl-api-keys.json
          SFL_SUCCESS_ROUND_SECONDS: "10"
          SFL_MIN_INTERVAL_SECONDS: "12"
      Tags:
        BillingTag: !Ref BillingTag
        ProjectNo: !Ref ProjectNo
      Events:
        ScheduledSync:
          Type: Schedule
          Properties:
            Schedule: cron(0 14,16,18,20,23 * * ? *)
            Name: !Sub ${ProjectNo}-${Environment}-${ProjectName}-sync
            Description: Full farm sync at 14:00, 16:00, 18:00, 20:00, and 23:00 UTC
            Enabled: true

  # ----------------------------------------------------------------
  # GitHub Actions OIDC — this repo only. Provider already exists.
  # ----------------------------------------------------------------

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Condition: IsDev
    Properties:
      RoleName: !Sub ${ProjectNo}-${Environment}-${ProjectName}-github-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Ref GitHubOidcClassicSubject
                  - !Ref GitHubOidcSubject
      Policies:
        - PolicyName: FrontendDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AppBucket.Arn
                  - !Sub "${AppBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
        - PolicyName: BackendDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - arn:aws:cloudformation:ap-southeast-1:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                Resource:
                  - !GetAtt AppBucket.Arn
                  - !Sub "${AppBucket.Arn}/*"
                  - !Sub arn:aws:s3:::${ProjectNo}-${Environment}-${ProjectName}-secrets
                  - !Sub arn:aws:s3:::${ProjectNo}-${Environment}-${ProjectName}-secrets/*
                  - arn:aws:s3:::aws-sam-cli-managed-*
                  - arn:aws:s3:::aws-sam-cli-managed-*/*
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:PublishLayerVersion
                  - lambda:GetLayerVersion
                  - lambda:DeleteLayerVersion
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectNo}-${Environment}-${ProjectName}-*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${ProjectNo}-${Environment}-${ProjectName}-*
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectNo}-${Environment}-${ProjectName}-main-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectNo}-${Environment}-${ProjectName}-farm-sync-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectNo}-${Environment}-${ProjectName}-github-deploy-role
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/${HttpApi}
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/${HttpApi}/*
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                Resource:
                  - !GetAtt TournamentConfigTable.Arn
                  - !GetAtt DigScoresTable.Arn
                  - !GetAtt PendingSubmissionsTable.Arn
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:DeleteRule
                  - events:ListTargetsByRule
                  - events:TagResource
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectNo}-${Environment}-${ProjectName}-*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectNo}-${Environment}-${ProjectName}-*
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:TagResource
                Resource:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
              - Effect: Allow
                Action:
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                Resource: "*"
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                Resource: "*"
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:SetUserPoolMfaConfig
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                  - cognito-idp:AddCustomAttributes
                Resource:
                  - !GetAtt CognitoUserPool.Arn
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  # ----------------------------------------------------------------
  # CloudFront — origin path /frontend
  # ----------------------------------------------------------------

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectNo}-${Environment}-${ProjectName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Aliases: !If
          - HasSiteDomain
          - !If
            - HasWwwDomain
            - - !Ref SiteDomainName
              - !Ref WwwDomainName
            - - !Ref SiteDomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasSiteDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginPath: /frontend
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: BillingTag
          Value: !Ref BillingTag
        - Key: ProjectNo
          Value: !Ref ProjectNo

  SiteDnsA:
    Type: AWS::Route53::RecordSet
    Condition: HasSiteDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

  SiteDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: HasSiteDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

  WwwDnsA:
    Type: AWS::Route53::RecordSet
    Condition: HasWwwDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

  WwwDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: HasWwwDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiCustomDomain
      ApiId: !Ref HttpApi
      Stage: !Ref Environment

  ApiDnsA:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        EvaluateTargetHealth: false

  ApiDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        EvaluateTargetHealth: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadFrontend
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AppBucket.Arn}/frontend/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Description: "API Gateway execute-api URL (fallback; browser uses BrowserApiUrl)"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-api-url"

  BrowserApiUrl:
    Description: "API URL the frontend should call (custom domain when set)"
    Value: !If
      - HasApiDomain
      - !Sub "https://${ApiDomainName}"
      - !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-browser-api-url"

  SiteUrl:
    Description: "Public site URL (custom domain when set)"
    Value: !If
      - HasSiteDomain
      - !Sub "https://${SiteDomainName}"
      - !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-site-url"

  AppBucketName:
    Description: "S3 bucket (frontend/ + config/tracked-farms.json)"
    Value: !Ref AppBucket
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-bucket"

  SecretsBucketName:
    Description: "Private bucket for SFL API keys JSON (not CloudFront)"
    Value: !Ref SecretsBucket
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-secrets-bucket"

  FrontendPrefix:
    Description: "S3 prefix CloudFront reads from"
    Value: frontend/
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-frontend-prefix"

  CloudFrontDomainName:
    Description: "CloudFront URL — paste this as AllowedOrigin after first deploy"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-cloudfront-domain"

  CloudFrontDistributionId:
    Description: "CloudFront distribution ID — for GitHub Actions cache invalidation"
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-cloudfront-id"

  GitHubActionsDeployRoleArn:
    Description: "IAM role ARN for GitHub Actions OIDC (this repo only). Dev: created by this stack. Prd: created out of band so the first Actions deploy can create the stack."
    Value: !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectNo}-${Environment}-${ProjectName}-github-deploy-role
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-github-deploy-role"

  TournamentConfigTableName:
    Value: !Ref TournamentConfigTable
  DigScoresTableName:
    Value: !Ref DigScoresTable
  PendingSubmissionsTableName:
    Value: !Ref PendingSubmissionsTable

  CognitoUserPoolId:
    Description: "Cognito user pool — create the Admin user in this pool"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-cognito-pool"

  CognitoUserPoolClientId:
    Description: "Cognito app client id — VITE_COGNITO_USER_POOL_CLIENT_ID"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${ProjectNo}-${Environment}-${ProjectName}-cognito-client"
