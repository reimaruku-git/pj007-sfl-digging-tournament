[project]
name = "pj007-digging-tournament"
version = "0.1.0"
description = "SFL Digging Tournament service"
authors = [{name = "rmr", email = "paner.rmr@gmail.com"}]
license = "MIT"
requires-python = ">=3.13,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.42.0"
requests = "^2.33.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.1.0"
moto = {extras = ["dynamodb", "s3"], version = "^5.1.0"}
responses = "^0.25.0"
black = "^26.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "lib", "lambda_functions/main_function", "lambda_functions/farm_sync"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]

[tool.black]
line-length = 100
target-version = ["py313"]
