name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-backend:
    name: Deploy backend (SAM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --config-env dev \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-mfrfb3arh90t \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectNo=pj007" \
              "ProjectName=digging-tournament" \
              "Environment=dev" \
              "BillingTag=pj007" \
              "AllowedOrigin=${{ vars.DEV_ALLOWED_ORIGIN }}" \
              "GitHubRepo=reimaruku-git/pj007-sfl-digging-tournament" \
              "GitHubOidcClassicSubject=repo:reimaruku-git/pj007-sfl-digging-tournament:*" \
              "GitHubOidcSubject=repo:reimaruku-git@248281558/pj007-sfl-digging-tournament@1334189130:*"

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.DEV_VITE_API_BASE }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.DEV_VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ vars.DEV_VITE_COGNITO_USER_POOL_CLIENT_ID }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 frontend/ prefix
        run: |
          aws s3 sync dist/ s3://${{ vars.DEV_S3_BUCKET }}/frontend/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ vars.DEV_S3_BUCKET }}/frontend/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.DEV_CF_DISTRIBUTION_ID }} \
            --paths "/*"
