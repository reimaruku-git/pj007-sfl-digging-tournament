name: Deploy prd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: sfl-pj007-prd-digging-tournament

jobs:
  deploy-backend:
    name: Deploy backend (SAM)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.stack.outputs.api_url }}
      bucket: ${{ steps.stack.outputs.bucket }}
      cf_id: ${{ steps.stack.outputs.cf_id }}
      cf_domain: ${{ steps.stack.outputs.cf_domain }}
      cognito_pool: ${{ steps.stack.outputs.cognito_pool }}
      cognito_client: ${{ steps.stack.outputs.cognito_client }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PRD_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          ORIGIN="${{ vars.PRD_ALLOWED_ORIGIN }}"
          if [ -z "$ORIGIN" ]; then
            ORIGIN="*"
          fi
          sam deploy \
            --config-env prd \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-hu85e30oy0ul \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectNo=pj007" \
              "ProjectName=digging-tournament" \
              "Environment=prd" \
              "BillingTag=pj007" \
              "AllowedOrigin=${ORIGIN}" \
              "GitHubRepo=reimaruku-git/pj007-sfl-digging-tournament" \
              "GitHubOidcClassicSubject=repo:reimaruku-git/pj007-sfl-digging-tournament:ref:refs/heads/main" \
              "GitHubOidcSubject=repo:reimaruku-git@248281558/pj007-sfl-digging-tournament@1334189130:ref:refs/heads/main"

      - name: Capture stack outputs
        id: stack
        working-directory: backend
        run: |
          get() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          API_URL="$(get ApiUrl)"
          BUCKET="$(get AppBucketName)"
          CF_ID="$(get CloudFrontDistributionId)"
          CF_DOMAIN="$(get CloudFrontDomainName)"
          POOL="$(get CognitoUserPoolId)"
          CLIENT="$(get CognitoUserPoolClientId)"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "cf_id=${CF_ID}" >> "$GITHUB_OUTPUT"
          echo "cf_domain=${CF_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "cognito_pool=${POOL}" >> "$GITHUB_OUTPUT"
          echo "cognito_client=${CLIENT}" >> "$GITHUB_OUTPUT"

      - name: Lock CORS to CloudFront origin
        run: |
          ORIGIN="${{ vars.PRD_ALLOWED_ORIGIN }}"
          CF_DOMAIN="${{ steps.stack.outputs.cf_domain }}"
          if [ -z "$ORIGIN" ] && [ -n "$CF_DOMAIN" ]; then
            sam deploy \
              --config-env prd \
              --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-hu85e30oy0ul \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                "ProjectNo=pj007" \
                "ProjectName=digging-tournament" \
                "Environment=prd" \
                "BillingTag=pj007" \
                "AllowedOrigin=${CF_DOMAIN}" \
                "GitHubRepo=reimaruku-git/pj007-sfl-digging-tournament" \
                "GitHubOidcClassicSubject=repo:reimaruku-git/pj007-sfl-digging-tournament:ref:refs/heads/main" \
                "GitHubOidcSubject=repo:reimaruku-git@248281558/pj007-sfl-digging-tournament@1334189130:ref:refs/heads/main"
          fi

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ needs.deploy-backend.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ needs.deploy-backend.outputs.cognito_pool }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ needs.deploy-backend.outputs.cognito_client }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PRD_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Sync to S3 frontend/ prefix
        run: |
          aws s3 sync dist/ s3://${{ needs.deploy-backend.outputs.bucket }}/frontend/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ needs.deploy-backend.outputs.bucket }}/frontend/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-backend.outputs.cf_id }} \
            --paths "/*"
